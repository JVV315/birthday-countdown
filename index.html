<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日倒计时 · 烛光许愿夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171210;
    --ink:#F2E6D8;
    --dim:rgba(242,230,216,.55);
    --gold:#F0A868;
    --coral:#E07856;
    --cream:#F2E6D8;
    --card:rgba(255,235,210,.045);
    --line:rgba(255,220,180,.14);
    --ease-motion:cubic-bezier(.2,1,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  /* 环境暗角 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 50% 42%, transparent 30%, rgba(0,0,0,.55) 100%);
  }
  main{position:relative;z-index:2;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}

  header{padding:72px 0 4px;text-align:center;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:var(--line);}
  h1{
    font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
    font-weight:900;font-size:clamp(40px,7.5vw,76px);line-height:1.2;
    margin-top:16px;letter-spacing:.06em;
    color:var(--cream);
    text-shadow:0 0 24px rgba(240,168,104,.35), 0 0 60px rgba(224,120,86,.18);
  }
  h1 .accent{color:var(--gold);}
  .sub{margin-top:12px;font-size:14.5px;color:var(--dim);letter-spacing:.14em;}

  /* 许愿场景 */
  .scene{display:block;margin:18px auto 0;width:min(460px,92vw);}
  .flame{transform-origin:center bottom;animation:flick 1.1s ease-in-out infinite;}
  .flame.f2{animation-delay:-.35s;}
  .flame.f3{animation-delay:-.7s;}
  .flame.f4{animation-delay:-.15s;}
  .flame.f5{animation-delay:-.55s;}
  @keyframes flick{
    0%,100%{transform:scale(1) rotate(0deg);}
    30%{transform:scale(1.1,.92) rotate(-3deg);}
    60%{transform:scale(.92,1.08) rotate(3deg);}
  }
  .glowp{transform-origin:center;animation:pulse 2.2s ease-in-out infinite;}
  .glowp.g2{animation-delay:-.7s;}
  .glowp.g3{animation-delay:-1.4s;}
  .glowp.g4{animation-delay:-.4s;}
  .glowp.g5{animation-delay:-1.1s;}
  @keyframes pulse{
    0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.95;transform:scale(1.18);}
  }

  /* 倒计时 */
  .countdown{
    margin-top:34px;display:grid;grid-template-columns:repeat(4,1fr);
    gap:clamp(8px,2vw,18px);
  }
  .cell{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:clamp(16px,3vw,28px) 8px;text-align:center;
    transition:transform .3s var(--ease-motion), box-shadow .3s var(--ease-motion), border-color .3s;
  }
  .cell:hover{
    transform:translateY(-5px);border-color:rgba(240,168,104,.4);
    box-shadow:0 14px 40px -14px rgba(240,168,104,.35);
  }
  .num{
    font-family:"Archivo Black","Arial Black",sans-serif;
    font-size:clamp(32px,6.5vw,64px);line-height:1;font-variant-numeric:tabular-nums;
    color:var(--cream);text-shadow:0 0 18px rgba(240,168,104,.4);
  }
  .unit{margin-top:9px;font-size:12.5px;letter-spacing:.4em;color:var(--dim);text-indent:.4em;}

  .hbd{display:none;margin-top:40px;text-align:center;}
  body.is-today .hbd{display:block;}
  body.is-today .countdown,body.is-today .progress-block,body.is-today .milestones{display:none;}
  .hbd .big{
    font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
    font-size:clamp(38px,8.5vw,88px);font-weight:900;color:var(--gold);letter-spacing:.08em;
    text-shadow:0 0 30px rgba(240,168,104,.55);
  }
  .hbd p{margin-top:12px;color:var(--dim);letter-spacing:.2em;}

  .target{margin-top:26px;text-align:center;font-size:14.5px;color:var(--dim);letter-spacing:.1em;}
  .target strong{color:var(--cream);font-weight:600;}

  .progress-block{margin-top:36px;}
  .progress-label{
    display:flex;justify-content:space-between;font-size:12.5px;
    color:var(--dim);letter-spacing:.12em;margin-bottom:8px;
  }
  .track{height:8px;border-radius:99px;background:rgba(255,220,180,.1);overflow:hidden;}
  .fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#8A4B2E,var(--gold),var(--coral));
    box-shadow:0 0 12px rgba(240,168,104,.5);
    transition:width 1.2s var(--ease-motion);
  }

  .milestones{margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .chip{
    border:1px dashed var(--line);border-radius:14px;padding:16px 8px;text-align:center;
    background:rgba(255,235,210,.03);
  }
  .chip b{
    display:block;font-family:"Archivo Black",sans-serif;font-size:22px;color:var(--gold);
    font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(240,168,104,.35);
  }
  .chip span{font-size:12px;color:var(--dim);letter-spacing:.2em;}

  .blessing{
    margin:40px auto 0;max-width:640px;text-align:center;
    font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
    font-size:clamp(17px,2.6vw,21px);line-height:2;color:var(--dim);
  }
  .blessing em{font-style:normal;color:var(--gold);}

  .hint{margin-top:22px;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.2em;opacity:.7;}
  footer{margin-top:48px;padding:24px 0 40px;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.28em;}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:50;}

  @media (max-width:560px){ .milestones{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<main>
  <div class="wrap">

    <header>
      <span class="eyebrow">MAKE A WISH</span>
      <h1>烛光下的<span class="accent">心愿</span></h1>
      <p class="sub">农历 四月 初十 · 愿望正在酝酿中</p>
    </header>

    <!-- 许愿场景：女孩在蛋糕前闭眼许愿 -->
    <svg class="scene" viewBox="0 0 420 340" aria-label="女孩在生日蛋糕前许愿的场景">
      <defs>
        <radialGradient id="haloGrad" cx="50%" cy="68%" r="55%">
          <stop offset="0%" stop-color="#F0A868" stop-opacity=".34"/>
          <stop offset="45%" stop-color="#E07856" stop-opacity=".14"/>
          <stop offset="100%" stop-color="#E07856" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFD9A0" stop-opacity=".85"/>
          <stop offset="40%" stop-color="#F0A868" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#F0A868" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vign" cx="50%" cy="60%" r="75%">
          <stop offset="55%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
        </radialGradient>
      </defs>

      <!-- 烛光主光晕 -->
      <ellipse cx="210" cy="232" rx="185" ry="125" fill="url(#haloGrad)"/>

      <!-- 女孩 -->
      <g>
        <!-- 身体（裙子） -->
        <path d="M152 272 C152 216 176 196 210 196 C244 196 268 216 268 272 Z" fill="#A85D6E"/>
        <path d="M152 272 C152 216 176 196 210 196 C244 196 268 216 268 272" fill="none" stroke="rgba(255,215,170,.25)" stroke-width="1.5"/>
        <!-- 脖子 -->
        <rect x="203" y="172" width="14" height="26" rx="6" fill="#F2C9A8"/>
        <!-- 后发 -->
        <ellipse cx="210" cy="124" rx="42" ry="40" fill="#4A3128"/>
        <path d="M172 128 C166 156 170 178 180 192 L190 188 C182 172 180 152 184 136 Z" fill="#4A3128"/>
        <path d="M248 128 C254 156 250 178 240 192 L230 188 C238 172 240 152 236 136 Z" fill="#4A3128"/>
        <!-- 脸 -->
        <circle cx="210" cy="136" r="32" fill="#F2C9A8"/>
        <!-- 刘海 -->
        <path d="M178 136 C178 110 196 100 210 100 C224 100 242 110 242 136 C236 118 226 112 210 112 C194 112 184 118 178 136 Z" fill="#4A3128"/>
        <!-- 闭眼（许愿中） -->
        <path d="M193 140 q7 6 14 0" fill="none" stroke="#4A3128" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M213 140 q7 6 14 0" fill="none" stroke="#4A3128" stroke-width="2.6" stroke-linecap="round"/>
        <!-- 睫毛 -->
        <path d="M194 145 l-3 3 M206 145 l2 3.4 M214 145 l-2 3.4 M226 145 l3 3" stroke="#4A3128" stroke-width="1.6" stroke-linecap="round"/>
        <!-- 腮红 -->
        <ellipse cx="190" cy="151" rx="5.5" ry="3.6" fill="#E07856" opacity=".45"/>
        <ellipse cx="230" cy="151" rx="5.5" ry="3.6" fill="#E07856" opacity=".45"/>
        <!-- 微笑 -->
        <path d="M203 156 q7 5 14 0" fill="none" stroke="#B4586B" stroke-width="2.4" stroke-linecap="round"/>
        <!-- 合掌的手 -->
        <ellipse cx="199" cy="182" rx="9" ry="14" fill="#F2C9A8" transform="rotate(22 199 182)"/>
        <ellipse cx="221" cy="182" rx="9" ry="14" fill="#F2C9A8" transform="rotate(-22 221 182)"/>
        <path d="M210 170 L210 196" stroke="rgba(74,49,46,.35)" stroke-width="1.6"/>
        <!-- 袖口 -->
        <path d="M188 196 q22 12 44 0 l-4 10 q-18 8 -36 0 Z" fill="#8A4B5E"/>
      </g>

      <!-- 桌子 -->
      <rect x="0" y="272" width="420" height="68" fill="#241812"/>
      <line x1="0" y1="272" x2="420" y2="272" stroke="rgba(240,168,104,.28)" stroke-width="1.5"/>

      <!-- 蛋糕 -->
      <ellipse cx="210" cy="272" rx="98" ry="9" fill="#2A1E16" stroke="rgba(240,168,104,.35)" stroke-width="1.5"/>
      <!-- 下层 -->
      <rect x="128" y="220" width="164" height="50" rx="10" fill="#D97B52"/>
      <path d="M128 232 q14 13 27 0 t27 0 t27 0 t27 0 t27 0 t27 0" fill="none" stroke="#F2E6D8" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="128" y="220" width="164" height="50" rx="10" fill="none" stroke="rgba(255,215,170,.3)" stroke-width="1.2"/>
      <!-- 上层 -->
      <rect x="160" y="182" width="100" height="42" rx="9" fill="#F2E6D8"/>
      <path d="M160 193 q13 12 25 0 t25 0 t25 0 t25 0" fill="none" stroke="#D97B52" stroke-width="3" stroke-linecap="round"/>
      <!-- 樱桃 -->
      <circle cx="178" cy="179" r="5.5" fill="#B4586B"/>
      <circle cx="210" cy="176" r="5.5" fill="#B4586B"/>
      <circle cx="242" cy="179" r="5.5" fill="#B4586B"/>
      <circle cx="176.5" cy="177" r="1.4" fill="#F2E6D8" opacity=".8"/>
      <circle cx="208.5" cy="174" r="1.4" fill="#F2E6D8" opacity=".8"/>

      <!-- 蜡烛 × 5 -->
      <g>
        <!-- 烛身 -->
        <rect x="176" y="152" width="7" height="26" rx="3" fill="#E07856"/>
        <rect x="193" y="146" width="7" height="32" rx="3" fill="#7A9E7E"/>
        <rect x="210" y="142" width="7" height="36" rx="3" fill="#E07856"/>
        <rect x="227" y="146" width="7" height="32" rx="3" fill="#7A9E7E"/>
        <rect x="244" y="152" width="7" height="26" rx="3" fill="#E07856"/>
        <!-- 光晕 -->
        <circle class="glowp"    cx="179.5" cy="142" r="17" fill="url(#flameGlow)"/>
        <circle class="glowp g2" cx="196.5" cy="136" r="19" fill="url(#flameGlow)"/>
        <circle class="glowp g3" cx="213.5" cy="132" r="22" fill="url(#flameGlow)"/>
        <circle class="glowp g4" cx="230.5" cy="136" r="19" fill="url(#flameGlow)"/>
        <circle class="glowp g5" cx="247.5" cy="142" r="17" fill="url(#flameGlow)"/>
        <!-- 火苗 -->
        <ellipse class="flame"    cx="179.5" cy="143" rx="3.6" ry="6.6" fill="#FFD9A0"/>
        <ellipse class="flame f2" cx="196.5" cy="137" rx="3.8" ry="7.2" fill="#FFD9A0"/>
        <ellipse class="flame f3" cx="213.5" cy="133" rx="4.2" ry="8"   fill="#FFD9A0"/>
        <ellipse class="flame f4" cx="230.5" cy="137" rx="3.8" ry="7.2" fill="#FFD9A0"/>
        <ellipse class="flame f5" cx="247.5" cy="143" rx="3.6" ry="6.6" fill="#FFD9A0"/>
      </g>

      <!-- 压暗四周 -->
      <rect x="0" y="0" width="420" height="340" fill="url(#vign)" pointer-events="none"/>
    </svg>

    <section class="countdown" aria-label="倒计时">
      <div class="cell"><div class="num" id="d">--</div><div class="unit">天</div></div>
      <div class="cell"><div class="num" id="h">--</div><div class="unit">时</div></div>
      <div class="cell"><div class="num" id="m">--</div><div class="unit">分</div></div>
      <div class="cell"><div class="num" id="s">--</div><div class="unit">秒</div></div>
    </section>

    <div class="hbd">
      <div class="big">今天就是生日！</div>
      <p>快许个愿吧，蜡烛都替你点好了</p>
    </div>

    <p class="target" id="targetText">正在换算农历日期…</p>

    <section class="progress-block">
      <div class="progress-label"><span>本轮等待进度</span><span id="pct">0%</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </section>

    <section class="milestones" aria-label="换算">
      <div class="chip"><b id="wks">–</b><span>约等于 周</span></div>
      <div class="chip"><b id="hrs">–</b><span>约等于 小时</span></div>
      <div class="chip"><b id="sleeps">–</b><span>睡多少个觉</span></div>
      <div class="chip"><b id="cups">–</b><span>够喝多少杯奶茶</span></div>
    </section>

    <p class="blessing">
      烛光里许下的愿，<em>会实现的</em>。<br>
      愿你新的一岁，温柔且有光。
    </p>

    <p class="hint">点按页面任意处，让烛光为你撒一把星光</p>

    <footer>农历四月十 · 岁岁常欢愉</footer>
  </div>
</main>

<script src="lunar.js"></script>
<script src="app.js"></script>
</body>
</html>
